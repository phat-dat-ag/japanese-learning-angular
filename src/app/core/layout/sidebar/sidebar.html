<aside class="flex h-full w-64 flex-col border-r border-gray-200 bg-white">
    <div class="border-b border-gray-100 px-5 py-5">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl
                       bg-indigo-50 text-lg text-indigo-600">
                学
            </div>

            <div>
                <h2 class="text-sm font-bold text-gray-800">
                    Learning Center
                </h2>

                <p class="mt-0.5 text-xs text-gray-400">
                    Your Japanese journey
                </p>
            </div>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-5">
        <p class="mb-2 px-3 text-[10px] font-bold uppercase tracking-wider text-gray-400">
            Main
        </p>

        <ul class="space-y-1">
            <li>
                <a routerLink="/" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    [routerLinkActiveOptions]="{ exact: true }" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               transition-colors
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z" />
                        </svg>
                    </div>

                    <span>Home</span>
                </a>
            </li>

            <li>
                <a routerLink="/lessons" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253" />
                        </svg>
                    </div>

                    <span>Lessons</span>
                </a>
            </li>

            <li>
                <a routerLink="/vocabulary" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 20h9M12 4h9M3 6h1m-1 6h1m-1 6h1m3-12h2m-2 6h2m-2 6h2" />
                        </svg>
                    </div>

                    <span>Vocabulary</span>
                </a>
            </li>

            <li>
                <a routerLink="/grammar" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 7h16M4 12h16M4 17h10" />
                        </svg>
                    </div>

                    <span>Grammar</span>
                </a>
            </li>

            <li>
                <a routerLink="/kanji" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">
                        <span class="text-sm font-bold">漢</span>
                    </div>

                    <span>Kanji</span>
                </a>
            </li>

            <li>
                <a routerLink="/flashcards" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    [routerLinkActiveOptions]="{ exact: true }" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5Zm4 2h8m-8 4h8m-8 4h5" />
                        </svg>
                    </div>

                    <span>Flashcards</span>

                    <span class="ml-auto rounded-full bg-indigo-100 px-2 py-0.5
                               text-[10px] font-bold text-indigo-600">
                        Learn
                    </span>
                </a>
            </li>

        </ul>

        <p class="mb-2 mt-8 px-3 text-[10px] font-bold uppercase tracking-wider text-gray-400">
            Practice
        </p>

        <ul class="space-y-1">
            <li>
                <a [routerLink]="['/kanji-quiz']" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-gray-600 transition-all duration-200 hover:bg-gray-50 hover:text-indigo-600">
                    <span aria-hidden="true"
                        class="flex h-8 w-8 items-center justify-center rounded-lg bg-gray-100 text-sm font-bold text-gray-500 group-hover:bg-indigo-100 group-hover:text-indigo-600">漢</span>
                    <span>Kanji Quiz</span>
                </a>
            </li>
            <li>
                <a href="#" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100 text-gray-500
                               group-hover:bg-indigo-100 group-hover:text-indigo-600">

                        <span>🎯</span>
                    </div>

                    <span>Daily Practice</span>
                </a>
            </li>

            <li>
                <a href="#" class="group flex items-center gap-3 rounded-xl px-3 py-2.5
                           text-sm font-medium text-gray-600
                           transition-all duration-200
                           hover:bg-gray-50 hover:text-indigo-600">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg
                               bg-gray-100
                               group-hover:bg-indigo-100">

                        <span>📊</span>
                    </div>

                    <span>Progress</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="border-t border-gray-100 p-4">
        <div class="rounded-xl bg-gradient-to-br from-indigo-50 to-violet-50 p-3">
            <div class="flex items-center gap-2">
                <span class="text-lg">🌸</span>

                <div>
                    <p class="text-xs font-semibold text-indigo-700">
                        Keep learning!
                    </p>

                    <p class="mt-0.5 text-[10px] text-indigo-500">
                        一歩ずつ頑張ろう
                    </p>
                </div>
            </div>
        </div>

        <p class="mt-3 text-center text-[10px] text-gray-400">
            Japanese Learning App
        </p>
    </div>
</aside>
