<div class="mx-auto max-w-5xl px-6 py-8">
  <a [routerLink]="['/flashcards']" class="text-sm font-medium text-gray-500 hover:text-indigo-600">&larr; Back to
    flashcards</a>
  @let current = state();
  <section class="mt-6" aria-label="Flashcard detail" [attr.aria-busy]="current.status === 'loading'">
    @switch (current.status) {
    @case ('loading') {
    <p role="status" class="py-12 text-center text-gray-500">Loading flashcard...</p>
    }
    @case ('missing') {
    <h1 class="text-xl font-bold text-gray-900">Flashcard not found</h1>
    <p role="status" class="mt-4 text-gray-500">Check the flashcard ID and try again.</p>
    }
    @case ('error') {
    <p role="alert" class="text-red-700">Unable to load flashcard. Please try again.</p>
    <button type="button" (click)="retry()"
      class="mt-4 rounded-lg bg-indigo-600 px-5 py-2 font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
      Try again
    </button>
    }
    @case ('loaded') {
    <app-flashcard [card]="current.card" />
    }
    }
  </section>
</div>
