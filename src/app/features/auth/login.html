<section
  class="mx-auto max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-sm"
  aria-labelledby="login-title"
>
  <h1 id="login-title" class="mb-6 text-2xl font-bold text-gray-900">Sign in</h1>
  @if (auth.authenticated()) {
    <p class="mb-4 text-gray-700">Signed in as {{ auth.user()?.email ?? 'a Japanese learner' }}.</p>
    <button
      type="button"
      (click)="logout()"
      [disabled]="loading() || auth.busy()"
      class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white disabled:opacity-50"
    >
      Sign out
    </button>
  } @else {
    <form #form="ngForm" (ngSubmit)="submit()" [attr.aria-busy]="loading()">
      <label for="email" class="mb-1 block font-medium text-gray-700">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
        email
        [(ngModel)]="email"
        [disabled]="loading()"
        class="mb-4 w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-indigo-600"
      />
      <label for="password" class="mb-1 block font-medium text-gray-700">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [(ngModel)]="password"
        [disabled]="loading()"
        class="mb-6 w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-indigo-600"
      />
      <button
        type="submit"
        [disabled]="form.invalid || loading() || auth.busy()"
        class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  }
  @if (error()) {
    <p role="alert" class="mt-4 text-sm text-red-700">{{ error() }}</p>
  }
</section>
