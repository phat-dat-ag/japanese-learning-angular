<form #form="ngForm" (ngSubmit)="submit()" novalidate>
  <fieldset [disabled]="locked()" class="min-w-0 space-y-5">
    <legend class="mb-4 text-lg font-semibold text-gray-900">Adding Part of Speech</legend>

    <div>
      <label for="part-of-speech-code" class="text-sm font-medium text-gray-700">Master-data code <span
          class="font-normal text-gray-500">(required)</span></label>
      <input #first id="part-of-speech-code" [attr.aria-invalid]="
          !!fieldErrors().code || ((codeControl.touched || form.submitted) && !valid)
        " name="code" [(ngModel)]="code" #codeControl="ngModel" required maxlength="50"
        aria-describedby="pos-help pos-error"
        class="aria-invalid:border-red-600 mt-2 block min-h-11 w-full rounded-xl border border-gray-300 bg-white px-3 py-2 text-gray-900 focus-visible:outline-2 focus-visible:outline-indigo-600" />
      <p id="pos-help" class="mt-2 text-sm text-gray-600">
        Enter an existing part-of-speech code. The server checks that the code exists.
      </p>
      <p id="pos-error" class="mt-2 text-sm text-red-700">
        {{
        fieldErrors().code ||
        ((codeControl.touched || form.submitted) && !valid
        ? 'Enter a nonblank code, up to 50 characters.'
        : '')
        }}
      </p>
    </div>

    <app-vocabulary-form-actions saveLabel="Save part of speech" [locked]="locked()" [invalid]="!valid"
      (cancelled)="cancelled.emit()" />
  </fieldset>
</form>
