<form #form="ngForm" (ngSubmit)="submit()" novalidate>
  <fieldset [disabled]="locked()" class="space-y-5">
    <legend class="mb-4 text-lg font-semibold text-gray-900">
      {{ initial() ? 'Editing Pitch Accent' : 'Adding Pitch Accent' }}
    </legend>

    <div>
      <label for="accent-reading" class="text-sm font-medium text-gray-700">Reading</label>
      <select
        #first
        id="accent-reading"
        name="readingId"
        [(ngModel)]="readingId"
        required
        aria-describedby="accent-reading-error"
        class="mt-2 block min-h-11 w-full rounded-xl border border-gray-300 bg-white px-3 py-2 text-gray-900 focus-visible:outline-2 focus-visible:outline-indigo-600"
      >
        <option [ngValue]="null">Choose a reading</option>
        @for (reading of readings(); track reading.readingId) {
          <option [ngValue]="reading.readingId">
            {{ reading.reading }} (ID {{ reading.readingId }})
          </option>
        }
      </select>
      <p id="accent-reading-error" class="mt-2 text-sm text-red-700">
        {{ fieldErrors().readingId }}
      </p>
    </div>
    <div>
      <label for="accent-pattern" class="text-sm font-medium text-gray-700">Accent pattern</label>
      <input
        id="accent-pattern"
        name="accentPattern"
        type="number"
        min="0"
        max="65535"
        step="1"
        required
        [(ngModel)]="accentPattern"
        #pattern="ngModel"
        aria-describedby="accent-pattern-error"
        class="mt-2 block min-h-11 w-full rounded-xl border border-gray-300 bg-white px-3 py-2 text-gray-900 focus-visible:outline-2 focus-visible:outline-indigo-600"
      />
      <p id="accent-pattern-error" class="mt-2 text-sm text-red-700">
        {{
          fieldErrors().accentPattern ||
            ((pattern.touched || form.submitted) && !validPattern
              ? 'Enter a whole number from 0 to 65535.'
              : '')
        }}
      </p>
    </div>

    <div class="flex flex-wrap gap-3">
      <button
        type="submit"
        [disabled]="locked() || !valid"
        class="min-h-11 rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50 bg-indigo-600 text-white"
      >
        Save
      </button>
      <button
        type="button"
        (click)="cancelled.emit()"
        class="min-h-11 rounded-xl border border-gray-300 px-4 py-2 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50 bg-white text-gray-700"
      >
        Cancel
      </button>
    </div>
  </fieldset>
</form>
