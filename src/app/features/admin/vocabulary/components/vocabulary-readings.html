<app-vocabulary-section title="Readings" headingId="readings-heading"
  description="Pronunciations and primary readings for this vocabulary.">
  <button sectionActions #addButton type="button" [hidden]="formOpen()" (click)="open()"
    class="min-h-11 rounded-xl border border-indigo-200 bg-indigo-50 px-5 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
    Add Reading
  </button>

  <ul class="divide-y divide-gray-100">
    @for (item of items(); track item.readingId) {
    <li class="flex flex-wrap items-start justify-between gap-3 py-4">
      <div class="min-w-0 basis-full sm:basis-0 sm:flex-1">
        <p lang="ja" class="whitespace-pre-wrap break-words text-lg text-gray-900">
          {{ item.reading }}
        </p>
      </div>
      @if (item.isPrimary) {
      <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700">Primary</span>
      }
      <p class="text-sm text-gray-600">Order {{ item.displayOrder }}</p>
      <button #editButton type="button" [disabled]="formOpen()" (click)="edit(item, editButton)"
        [attr.aria-label]="'Edit reading ' + item.reading + ' (ID ' + item.readingId + ')'"
        [attr.data-child-id]="item.readingId"
        class="min-h-11 rounded-xl border border-indigo-200 px-4 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50">
        Edit
      </button>
    </li>
    } @empty {
    <li class="py-4 text-sm text-gray-600">No readings yet.</li>
    }
  </ul>

  <div [attr.aria-busy]="busy()">
    @if (formOpen()) {
    <app-vocabulary-reading-form [initial]="selected()" [locked]="locked()" [fieldErrors]="fields()"
      [hasPrimary]="hasPrimary()" (submitted)="save($event)" (cancelled)="cancel()" />
    }
  </div>

  <app-vocabulary-add-feedback [state]="state()" [operation]="operation()" kind="Reading" (retried)="retryRefresh()" />
</app-vocabulary-section>
