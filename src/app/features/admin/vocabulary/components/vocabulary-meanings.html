<app-vocabulary-section
  title="Meanings"
  headingId="meanings-heading"
  description="Translations and definitions by language."
>
  <button
    sectionActions
    #addButton
    type="button"
    [hidden]="adding()"
    (click)="open()"
    class="min-h-11 rounded-xl border border-indigo-200 bg-indigo-50 px-5 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
  >
    Add Meaning
  </button>
  <ul class="divide-y divide-gray-100">
    @for (item of items(); track item) {
      <li class="flex flex-wrap items-start justify-between gap-3 py-4">
        <div class="min-w-0 flex-1">
          <p class="mb-1 text-sm font-medium text-gray-600">
            {{ languageName(item.languageCode) }} ({{ item.languageCode }})
          </p>
          <p
            [attr.lang]="item.languageCode"
            class="whitespace-pre-wrap break-words text-lg text-gray-900"
          >
            {{ item.meaning }}
          </p>
        </div>
        @if (item.isPrimary) {
          <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700"
            >Primary</span
          >
        }
      </li>
    } @empty {
      <li class="py-4 text-sm text-gray-600">No meanings yet.</li>
    }
  </ul>
  <div [attr.aria-busy]="busy()">
    @if (adding()) {
      <app-vocabulary-meaning-form
        [locked]="locked()"
        [fieldErrors]="fields()"
        (submitted)="save($event)"
        (cancelled)="cancel()"
      />
    }
  </div>
  <app-vocabulary-add-feedback [state]="state()" kind="Meaning" (retried)="retryRefresh()" />
</app-vocabulary-section>
