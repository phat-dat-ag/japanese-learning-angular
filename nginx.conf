worker_processes auto;
worker_shutdown_timeout 65s;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_x_correlation_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_correlation_id;
    }
    # Request paths, query strings, headers and bodies can carry credentials.
    log_format frontend 'status=$status bytes=$body_bytes_sent duration=$request_time correlationId=$correlation_id';
    access_log /dev/stdout frontend;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api_gateway {
        zone api_gateway 64k;
        server gateway:8080 resolve;
    }
    server {
        listen 8080;
        server_name _;
        error_log /dev/null;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;
        client_header_timeout 10s;
        client_body_timeout 30s;
        send_timeout 30s;
        keepalive_timeout 30s;
        large_client_header_buffers 4 8k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Correlation-ID $correlation_id always;
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
        # Keep every API response, including errors and headers, owned by Gateway.
        location ~ ^/api(?:/|$) {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 65s;
            proxy_next_upstream off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_hide_header X-Correlation-ID;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Proxy "";
            proxy_set_header TE "";
            proxy_set_header Trailer "";
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
        }
        # Infrastructure URLs must never fall through to the Angular document.
        location ~ ^/(?:metrics|q|\.well-known|swagger|health)(?:/|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(?:js|css|map|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            try_files $uri =404;
        }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
